<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-..." crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-..."
        crossorigin="anonymous"></script>
    <style>
     body {
    background-image: url("image1.png");
    background-size: 100% auto;
    background-position: top center;
    background-repeat: repeat-y;
    min-height: 100vh;
}
    </style>
</head>

<body>
   
    <h1 id="head1" class="text-danger mt-3" >WELCOME KUTTU</h1>
    <div class="text-end " style="margin-top: -60px; margin-left: -40px;">
        <button type="button" class="btn btn-danger  " onclick="logout() ">Logout</button>
    </div>
    <h1 class="text-bold text-center text-danger">SMART WALLET</h1>
    <div class="row">
        <div class="col-6 ">
            
                <div class="border p-1 bg-white   mx-auto" style="width: 200px; height: 200px;">
                    <h3 class="text-danger ms-2"> Total Balance</h3>
                    <h3  id="incomedisplay" class="text-danger ms-2 text-center">Rs 0/-</h3>
                </div>
            
                
                    <input type="text"  id="inc" class="form-control  mx-auto mt-3 " placeholder="Enter Income Type"
                        style="width: 300px;">
                    <input type="text" id="amn" class="form-control mt-3 mx-auto" placeholder="Enter Amount"
                        style="width: 300px;">
            
                
                    <button class="btn btn-danger  mx-auto d-block mt-3 " onclick="addincome()" style="width: 300px;">Add Income</button>
                
           
        </div>
        <div class="col-6 mt-2">
           
                <div class="border p-1 bg-white   mx-auto" style="width: 200px; height: 200px;">
                    <h3 class="text-danger ms-2"> Total Expense</h3>
                    <h3 id="displayexpense" class="text-danger ms-2 text-center">Rs 0/-</h3>
                </div>
               
                    
                        <input type="text" id="exp" class="form-control mx-auto mt-3" placeholder="Enter Expense Type"
                            style="width: 300px;">
                        <input type="text"  id="expamn" class="form-control mt-3 mx-auto" placeholder="Enter Amount"
                            style="width: 300px;">
                    
                        <button class="btn btn-danger  mx-auto d-block mt-3 "  onclick="addexpense()" style="width: 300px;">Add
                            Expenses</button>
                    
                
           

        </div>
    </div>
    <div>
        <button onclick="clearAll()" class="btn btn-danger text mx-auto d-block mt-5">Clear</button>
    </div>
    <h1 class="text-bold text-center text-danger mt-5">Income And Expense Details</h1>
    <div class="row">
        <div class="col-6">
            <table class="table table-bordered bg-white text-center">

            <thead>
                <tr>
                    <th>Type</th>
                    <th>Income</th>
                    <th>Balance</th>
                    <th>Date & Time</th>
                </tr>
            </thead>

            <tbody id="incomeTable">

            </tbody>

        </table>
        </div>
                <div class="col-6">
                    <table class="table table-bordered bg-white text-center">
                     <thead>
                <tr>
                    <th>Type</th>
                    <th>Expense</th>
                    <th>Balance</th>
                    <th>Date & Time</th>
                </tr>
            </thead>

            <tbody id="expenseTable">

            </tbody>

        </table>
                </div>

    </div>

</body>
<script src="./home.js"></script>

</html>
