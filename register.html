<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-..." crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
  <style>
        body{
            background-image: url("image.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .btn-pink {
            background-color: #ff6584;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .btn-pink:hover {
            background-color: #e85573;
            color: #ffffff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 m-0">
    
         <div class=" bg-white rounded-5 shadow-lg p-4 border border-5 border-danger-subtle text-center"  style="width: 350px; padding: 40px !important; margin-top: 30px;">
            <h1 class="text-center text-danger ">Register</h1>
            <input type="text" id="uname"  class="form-control rounded-pill border-danger-subtle py-2 px-3 mt-4" placeholder="username">
     <input type="text" id="pswd"  class="form-control rounded-pill border-danger-subtle py-2 px-3 mt-4" placeholder="password">
     <div class="text-center mt-3">
        <button  onclick="register()" class="btn btn-pink border">Register</button>
     </div>

        
   
    
</body>
<script src="./register.js"></script>
</html>
